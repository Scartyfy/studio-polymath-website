<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Technical Blueprint Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#002FA7" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
    <pattern id="grid-large" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#002FA7" stroke-width="1.25" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Clean Architectural Canvas -->
  <rect width="1600" height="1000" fill="#F4F3EF" />
  <rect width="1600" height="1000" fill="url(#grid)" />
  <rect width="1600" height="1000" fill="url(#grid-large)" />

  <!-- Outer Architectural Framing -->
  <rect x="40" y="40" width="1520" height="920" fill="none" stroke="#002FA7" stroke-width="2" stroke-opacity="0.25" />
  <rect x="52" y="52" width="1496" height="896" fill="none" stroke="#002FA7" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="8 6" />

  <!-- Corner Precision Marks -->
  <!-- Top-Left -->
  <path d="M 30 40 L 60 40 M 40 30 L 40 60" stroke="#002FA7" stroke-width="2.5" />
  <!-- Top-Right -->
  <path d="M 1540 40 L 1570 40 M 1560 30 L 1560 60" stroke="#002FA7" stroke-width="2.5" />
  <!-- Bottom-Left -->
  <path d="M 30 960 L 60 960 M 40 940 L 40 970" stroke="#002FA7" stroke-width="2.5" />
  <!-- Bottom-Right -->
  <path d="M 1540 960 L 1570 960 M 1560 940 L 1560 970" stroke="#002FA7" stroke-width="2.5" />

  <!-- Header Technical Data -->
  <g transform="translate(80, 95)">
    <circle cx="6" cy="6" r="5" fill="#002FA7" />
    <text x="24" y="11" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#002FA7" text-transform="uppercase">
      PROJET FIL ROUGE // CY TECH · DESIGN GLOBAL
    </text>
  </g>
  <g transform="translate(1520, 95)">
    <text x="0" y="11" text-anchor="end" font-family="'JetBrains Mono', monospace, monospace" font-size="13" font-weight="500" letter-spacing="2" fill="#002FA7" fill-opacity="0.6">
      DOC. REF // P-04
    </text>
  </g>

  <!-- Central Badge & Placeholder Graphic -->
  <g transform="translate(800, 480)">
    <!-- Central Drafting Reticle -->
    <circle cx="0" cy="-60" r="70" fill="#FFFFFF" stroke="#002FA7" stroke-width="2" stroke-opacity="0.3" />
    <circle cx="0" cy="-60" r="50" fill="none" stroke="#002FA7" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.5" />
    
    <!-- Camera / Framing Stylized Icon -->
    <rect x="-28" y="-76" width="56" height="42" rx="4" fill="none" stroke="#002FA7" stroke-width="2.5" />
    <circle cx="0" cy="-55" r="12" fill="none" stroke="#002FA7" stroke-width="2.5" />
    <circle cx="16" cy="-68" r="3" fill="#002FA7" />
    <!-- Diagonal Subtle Drafting Slash -->
    <line x1="-38" y1="-30" x2="38" y2="-90" stroke="#002FA7" stroke-width="2" stroke-linecap="round" />

    <!-- Tag Badge -->
    <rect x="-160" y="30" width="320" height="32" rx="16" fill="#002FA7" fill-opacity="0.08" stroke="#002FA7" stroke-width="1" stroke-opacity="0.2" />
    <text x="0" y="51" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#002FA7">
      [ STATUT ARCHIVE // EN ATTENTE ]
    </text>

    <!-- Main Text requested by User -->
    <text x="0" y="125" text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" letter-spacing="2" fill="#002FA7">
      VISUEL EN COURS D'AJOUT
    </text>

    <!-- Subtitle / Context -->
    <text x="0" y="165" text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" letter-spacing="3" fill="#002FA7" fill-opacity="0.7">
      PLANCHE &amp; ÉCRAN EN COURS D'INTÉGRATION
    </text>
  </g>

  <!-- Footer Technical Coordinates -->
  <g transform="translate(80, 915)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#002FA7" fill-opacity="0.5">
      FIGMA · WIREFRAMES · USER RESEARCH · DESIGN D'INTERFACE
    </text>
  </g>
  <g transform="translate(1520, 915)">
    <text x="0" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#002FA7" fill-opacity="0.5">
      RESOLUTION 16:10 · ARCHIVE OFFICIELLE
    </text>
  </g>
</svg>
